name: Deploy catalog to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Typecheck every workspace
        run: |
          for dir in template games/*/; do
            [ -f "$dir/package.json" ] || continue
            echo "== typecheck $dir"
            (cd "$dir" && npx tsc --noEmit)
          done
      - name: Build catalog and games
        run: node scripts/build-site.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # Full design gates (headless sims + selftests) run out of the deploy path:
  # a slow balance sim must never block shipping the catalog.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Verify template
        run: cd template && bash scripts/verify.sh
      - name: Verify games (family gates)
        run: |
          for dir in games/*/; do
            [ -f "$dir/package.json" ] || continue
            echo "== verify $dir"
            (cd "$dir" && bash scripts/verify.sh)
          done

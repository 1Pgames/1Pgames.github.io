<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0b0f1a" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <title>Neon Hop</title>
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #05070d;
        touch-action: none;
        -webkit-tap-highlight-color: transparent;
        user-select: none;
      }
      #app {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
      }
      canvas {
        display: block;
        image-rendering: auto;
      }
      /* Boot splash: removed by the Boot scene once Phaser owns the screen. */
      #splash {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        font: 600 16px/1.4 system-ui, -apple-system, sans-serif;
        color: #7c8db5;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        background: #05070d;
        transition: opacity 220ms ease-out;
        pointer-events: none;
      }
      #splash.hidden {
        opacity: 0;
      }
      /* Catalog back-link + prompt chip; filled by new-game.sh, empty in the template. */
      #pagebar {
        position: fixed;
        top: max(10px, env(safe-area-inset-top));
        left: 10px;
        z-index: 10;
        display: flex;
        gap: 8px;
        align-items: flex-start;
        font: 500 12px/1.45 system-ui, -apple-system, sans-serif;
      }
      #pagebar .pill {
        display: inline-block;
        padding: 6px 12px;
        border-radius: 999px;
        color: #8fa1c7;
        background: rgba(10, 16, 30, 0.72);
        border: 1px solid rgba(143, 161, 199, 0.25);
        text-decoration: none;
        backdrop-filter: blur(6px);
      }
      #pagebar a.pill:hover {
        color: #f2f6ff;
        border-color: rgba(77, 225, 255, 0.6);
      }
      #pagebar details.pill {
        max-width: min(72vw, 420px);
        cursor: pointer;
      }
      #pagebar details.pill summary {
        list-style: none;
        outline: none;
      }
      #pagebar details.pill p {
        margin-top: 8px;
        color: #c7d3ee;
        font-style: italic;
        user-select: text;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="pagebar"><a class="pill" href="../../">&larr; Games</a><details class="pill prompt"><summary>&#9432; prompt</summary><p>неоновый платформер про прыжки по платформам над пропастью и сбор монеток</p></details></div>
    <div id="splash">loading</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

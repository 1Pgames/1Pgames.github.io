<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0b0f1a" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <title>GAME_TITLE</title>
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #05070d;
        touch-action: none;
        -webkit-tap-highlight-color: transparent;
        user-select: none;
      }
      #app {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
      }
      canvas {
        display: block;
        image-rendering: auto;
      }
      /* Boot splash: removed by the Boot scene once Phaser owns the screen. */
      #splash {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        font: 600 16px/1.4 system-ui, -apple-system, sans-serif;
        color: #7c8db5;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        background: #05070d;
        transition: opacity 220ms ease-out;
        pointer-events: none;
      }
      #splash.hidden {
        opacity: 0;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="splash">loading</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
